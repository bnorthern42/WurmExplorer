<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Surface Gradients (Dark Slate Palette) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222328"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#101012"/>
    </linearGradient>

    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04b97f" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#383a42" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#02875b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- 3D Terrain Tile Gradients (Emerald & Slate) -->
    <linearGradient id="tileTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02875b"/>
      <stop offset="45%" stop-color="#04b97f"/>
      <stop offset="100%" stop-color="#37efba"/>
    </linearGradient>

    <linearGradient id="tileLeftStrata" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3037"/>
      <stop offset="40%" stop-color="#24252a"/>
      <stop offset="100%" stop-color="#18191c"/>
    </linearGradient>

    <linearGradient id="tileRightStrata" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d21"/>
      <stop offset="60%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>

    <!-- Mineral / Ore Vein Glow -->
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37efba"/>
      <stop offset="60%" stop-color="#04b97f"/>
      <stop offset="100%" stop-color="#02875b"/>
    </linearGradient>

    <!-- Cartographic Reticle Accent -->
    <linearGradient id="reticleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37efba"/>
      <stop offset="100%" stop-color="#04b97f"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#37efba" flood-opacity="0.9"/>
    </filter>
    <filter id="surveyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#04b97f" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 1. Squircle App Badge Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#frameBorder)" stroke-width="4"/>

  <!-- 2. Subtle Cartography Grid Lines on Background -->
  <g opacity="0.12" stroke="#383a42" stroke-width="1.5">
    <line x1="84" y1="24" x2="84" y2="488"/>
    <line x1="170" y1="24" x2="170" y2="488"/>
    <line x1="256" y1="24" x2="256" y2="488"/>
    <line x1="342" y1="24" x2="342" y2="488"/>
    <line x1="428" y1="24" x2="428" y2="488"/>
    <line x1="24" y1="84" x2="488" y2="84"/>
    <line x1="24" y1="170" x2="488" y2="170"/>
    <line x1="24" y1="256" x2="488" y2="256"/>
    <line x1="24" y1="342" x2="488" y2="342"/>
    <line x1="24" y1="428" x2="488" y2="428"/>
  </g>

  <!-- 3. Surveyor Transit Outer Reticle Ring -->
  <circle cx="256" cy="245" r="172" fill="none" stroke="#04b97f" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.35"/>
  <circle cx="256" cy="245" r="148" fill="none" stroke="#37efba" stroke-width="1" opacity="0.25"/>

  <!-- Reticle Compass Ticks (N, S, E, W marks) -->
  <g stroke="#37efba" stroke-width="2" opacity="0.6">
    <line x1="256" y1="65" x2="256" y2="81"/>
    <line x1="256" y1="409" x2="256" y2="425"/>
    <line x1="76" y1="245" x2="92" y2="245"/>
    <line x1="420" y1="245" x2="436" y2="245"/>
  </g>

  <!-- 4. 3D Isometric Terrain Tile Group with Shadow -->
  <g filter="url(#tileShadow)">
    <!-- Cast Shadow Shape -->
    <polygon points="256,420 396,340 256,450 116,340" fill="#060608" opacity="0.5"/>

    <!-- Left Strata Face (Exposed Rock / Dirt Cliff) -->
    <polygon points="116,200 256,280 256,396 116,316" fill="url(#tileLeftStrata)" stroke="#383a42" stroke-width="1.5"/>

    <!-- Left Strata Layer Lines -->
    <path d="M 116,236 L 256,316" stroke="#18191c" stroke-width="3" opacity="0.8"/>
    <path d="M 116,276 L 256,356" stroke="#18191c" stroke-width="3.5" opacity="0.9"/>
    <path d="M 116,240 L 256,320" stroke="#383a42" stroke-width="1.5" opacity="0.6"/>

    <!-- Embedded Ore / Mineral Vein in Rock Strata -->
    <polygon points="144,272 176,256 226,306 194,322" fill="url(#veinGrad)" opacity="0.85" filter="url(#surveyGlow)"/>
    <polygon points="152,274 168,266 182,280 166,288" fill="#f4f4f5" opacity="0.4"/>

    <!-- Right Strata Face (Shaded Bedrock Face) -->
    <polygon points="256,280 396,200 396,316 256,396" fill="url(#tileRightStrata)" stroke="#222328" stroke-width="1.5"/>

    <!-- Right Strata Layer Lines -->
    <path d="M 256,316 L 396,236" stroke="#0d0d0f" stroke-width="3" opacity="0.9"/>
    <path d="M 256,356 L 396,276" stroke="#0d0d0f" stroke-width="3.5" opacity="0.9"/>

    <!-- Front Strata Center Ridge Highlight -->
    <line x1="256" y1="280" x2="256" y2="396" stroke="#383a42" stroke-width="2" opacity="0.8"/>

    <!-- Top Surface: Isometric Terrain Plateau (Sloped Dirt / Turf) -->
    <polygon points="256,120 396,200 256,280 116,200" fill="url(#tileTop)" stroke="#37efba" stroke-width="2"/>

    <!-- Top Surface: Internal Sub-Tile Elevation Grid (2x2 Corner Matrix) -->
    <line x1="186" y1="160" x2="326" y2="240" stroke="#0d3829" stroke-width="1.8" opacity="0.7"/>
    <line x1="326" y1="160" x2="186" y2="240" stroke="#0d3829" stroke-width="1.8" opacity="0.7"/>

    <!-- Topographic Contour Elevation Curves across the Tile -->
    <path d="M 152,190 Q 220,162 256,156 Q 292,162 360,190" fill="none" stroke="#37efba" stroke-width="2.5" opacity="0.55" stroke-linecap="round"/>
    <path d="M 186,220 Q 228,198 256,194 Q 284,198 326,220" fill="none" stroke="#f4f4f5" stroke-width="1.8" opacity="0.45" stroke-linecap="round"/>

    <!-- Slope Direction / Grade Vector Arrow (Terraforming & Water Flow) -->
    <path d="M 256,165 L 256,235" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <polyline points="250,225 256,235 262,225" fill="none" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

    <!-- 4 Corner Elevation Nodes (Representing Corner Math / Terraforming Vertices) -->
    <!-- North Vertex -->
    <circle cx="256" cy="120" r="7" fill="#121214" stroke="#37efba" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="256" cy="120" r="2.5" fill="#f4f4f5"/>

    <!-- East Vertex -->
    <circle cx="396" cy="200" r="7" fill="#121214" stroke="#37efba" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="396" cy="200" r="2.5" fill="#f4f4f5"/>

    <!-- South Vertex -->
    <circle cx="256" cy="280" r="7" fill="#121214" stroke="#37efba" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="256" cy="280" r="2.5" fill="#f4f4f5"/>

    <!-- West Vertex -->
    <circle cx="116" cy="200" r="7" fill="#121214" stroke="#37efba" stroke-width="3" filter="url(#nodeGlow)"/>
    <circle cx="116" cy="200" r="2.5" fill="#f4f4f5"/>
  </g>

  <!-- 5. Cartography & Tooling Overlay (Surveyor's Leveling Crosshair & Sextant Arc) -->
  <g filter="url(#surveyGlow)">
    <!-- Sextant Angle Arc -->
    <path d="M 216,110 A 130 130 0 0 1 296,110" fill="none" stroke="#04b97f" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="256" y1="98" x2="256" y2="108" stroke="#37efba" stroke-width="2"/>
    <line x1="236" y1="102" x2="238" y2="111" stroke="#37efba" stroke-width="1.5"/>
    <line x1="276" y1="102" x2="274" y2="111" stroke="#37efba" stroke-width="1.5"/>

    <!-- Central Crosshair Reticle Diamond over Tile Center -->
    <polygon points="256,182 272,200 256,218 240,200" fill="#0d3829" fill-opacity="0.6" stroke="#37efba" stroke-width="2"/>
    <line x1="230" y1="200" x2="282" y2="200" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="256" y1="174" x2="256" y2="226" stroke="#f4f4f5" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="256" cy="200" r="3.5" fill="#37efba" filter="url(#nodeGlow)"/>
  </g>

  <!-- Subtle Corner Frame Tech Accents -->
  <g stroke="#04b97f" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="48,72 48,48 72,48"/>
    <polyline points="440,48 464,48 464,72"/>
    <polyline points="48,440 48,464 72,464"/>
    <polyline points="440,464 464,464 464,440"/>
  </g>
</svg>
