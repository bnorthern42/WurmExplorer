name: CI/CD & AppImage Build

on:
  release:
    types: [published]
  workflow_dispatch:
    # Keep manual triggers available

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            meson \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libvips-dev \
            libopencv-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libtesseract-dev \
            libomp-dev \
            python3 \
            python3-pip

      - name: Fetch Map Assets
        env:
          MAP_FOLDER_ID: "0B6J_aGQ6URL8UURFN2VadWxtSWs"
        run: |
          pip3 install --break-system-packages gdown requests || pip install gdown requests
          python3 scripts/fetch_maps.py --folder-id $MAP_FOLDER_ID --dest assets/maps/

      - name: Setup Meson Build
        run: meson setup builddir --buildtype=debug

      - name: Compile
        run: ninja -C builddir

      - name: Execute Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: meson test -C builddir --verbose

  build:
    name: Build & Release (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # -----------------------------------------------------------
      # Linux Build (AppImage)
      # -----------------------------------------------------------
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            meson \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libvips-dev \
            libopencv-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libtesseract-dev \
            libomp-dev \
            python3 \
            python3-pip \
            curl \
            file

      - name: Fetch Map Assets (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          MAP_FOLDER_ID: "0B6J_aGQ6URL8UURFN2VadWxtSWs"
        run: |
          pip3 install --break-system-packages gdown requests || pip install gdown requests
          python3 scripts/fetch_maps.py --folder-id $MAP_FOLDER_ID --dest assets/maps/ --target-year 2026

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      # -----------------------------------------------------------
      # macOS Build (Homebrew)
      # -----------------------------------------------------------
      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          bash scripts/install_dependencies.sh

      - name: Build macOS Binary
        if: runner.os == 'macOS'
        run: |
          QT6_PREFIX="$(brew --prefix qt6)"
          export CMAKE_PREFIX_PATH="${QT6_PREFIX}:${CMAKE_PREFIX_PATH:-}"
          export PKG_CONFIG_PATH="${QT6_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PATH="${QT6_PREFIX}/bin:${PATH}"
          meson setup builddir --buildtype=release
          ninja -C builddir
          cp builddir/wurm_explorer builddir/WurmExplorer-macos
          chmod +x builddir/WurmExplorer-macos

      # -----------------------------------------------------------
      # Windows Build (MSYS2 UCRT64)
      # -----------------------------------------------------------
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Install Windows Dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/install_dependencies_windows.sh -y

      - name: Build Windows Binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          meson setup builddir --buildtype=release
          ninja -C builddir

      # -----------------------------------------------------------
      # Artifact Uploads
      # -----------------------------------------------------------
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: WurmExplorer-${{ matrix.os }}
          path: |
            builddir/*.AppImage
            builddir/*.exe
            builddir/WurmExplorer-macos
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builddir/WurmExplorer-x86_64.AppImage
            builddir/wurm_explorer.exe
            builddir/WurmExplorer-macos
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker / Podman Container
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: wurmexplorer:latest
          load: true

      - name: Validate Container Binary
        run: |
          docker run --rm wurmexplorer:latest --version || true
