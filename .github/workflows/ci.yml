name: CI/CD & AppImage Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            meson \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libvips-dev \
            libopencv-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libtesseract-dev \
            libomp-dev

      - name: Setup Meson Build
        run: meson setup builddir --buildtype=debug

      - name: Compile
        run: ninja -C builddir

      - name: Execute Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: meson test -C builddir --verbose

  appimage:
    name: Build AppImage Package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            g++ \
            meson \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libvips-dev \
            libopencv-dev \
            libyaml-cpp-dev \
            nlohmann-json3-dev \
            libtesseract-dev \
            libomp-dev \
            curl \
            file

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WurmExplorer-x86_64.AppImage
          path: builddir/WurmExplorer-x86_64.AppImage
          retention-days: 14

      - name: Publish GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: builddir/WurmExplorer-x86_64.AppImage
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker / Podman Container
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: wurmexplorer:latest
          load: true

      - name: Validate Container Binary
        run: |
          docker run --rm wurmexplorer:latest --version || true
